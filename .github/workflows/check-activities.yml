name: Check activity page
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node scripts/build-preview.mjs
      - name: Check generated JavaScript
        run: |
          for file in dist/src/*.js; do node --check "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: activity-page-preview
          path: dist
